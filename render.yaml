services:
  - name: gege-palace
    type: web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PAYMENT_METHOD
        value: api
      - key: MPAY_API_KEY
        sync: false
      - key: MPAY_API_SECRET
        sync: false
      - key: MPAY_ENDPOINT
        value: https://api.mpays.cn
      - key: PUBLIC_URL
        fromGenerate: domain
    healthCheckPath: /api/health
    autoDeploy: true
    region: singapore
